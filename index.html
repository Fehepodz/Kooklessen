<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kooklessen — Recepten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-inner">
        <button class="logo-btn" onclick="navigeer('lijst')">
          <i class="fas fa-utensils"></i>
          Kooklessen
        </button>
        <div id="header-acties"></div>
      </div>
    </header>
    <main id="main"></main>
  </div>

  <div id="snippet-overlay" class="overlay verborgen" onclick="sluitSnippetModal()"></div>
  <div id="snippet-modal" class="modal verborgen">
    <div class="modal-header">
      <h2>Voeg een techniek in</h2>
      <button class="sluit-btn" onclick="sluitSnippetModal()"><i class="fas fa-xmark"></i></button>
    </div>
    <div id="snippet-tabs" class="modal-tabs"></div>
    <div id="snippet-grid" class="modal-body"></div>
  </div>

  <div id="verwijder-overlay" class="overlay verborgen" onclick="sluitVerwijderModal()"></div>
  <div id="verwijder-modal" class="modal verborgen">
    <div style="padding:28px">
      <h3 style="margin-bottom:8px">Recept verwijderen?</h3>
      <p style="color:var(--tekst-licht);font-size:.9rem;margin-bottom:20px">Dit kan niet ongedaan worden gemaakt.</p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="sluitVerwijderModal()">Annuleren</button>
        <button class="btn btn-gevaar" id="bevestig-verwijder-knop">Verwijderen</button>
      </div>
    </div>
  </div>

  <script src="snippets.js"></script>
  <script src="app.js"></script>
</body>
</html>
